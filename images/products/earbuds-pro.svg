<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#e9ecef"/>
    </linearGradient>
    <linearGradient id="caseDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24252a"/>
      <stop offset="50%" stop-color="#141518"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  <rect width="500" height="500" rx="16" fill="url(#cardBg)"/>
  
  <g transform="translate(50, 40)">
    <!-- Shadow -->
    <ellipse cx="200" cy="360" rx="120" ry="25" fill="#000" opacity="0.15" filter="blur(8px)"/>
    
    <!-- Left Earbud Tip standing behind -->
    <g transform="translate(130, 60)">
      <rect x="20" y="80" width="14" height="90" rx="7" fill="#1b1c20"/>
      <ellipse cx="27" cy="60" rx="20" ry="25" fill="#09090b"/>
    </g>

    <!-- Right Earbud Tip standing behind -->
    <g transform="translate(230, 60)">
      <rect x="20" y="80" width="14" height="90" rx="7" fill="#1b1c20"/>
      <ellipse cx="27" cy="60" rx="20" ry="25" fill="#09090b"/>
    </g>

    <!-- Black Charging Case -->
    <path d="M 90,200 C 90,160 130,150 200,150 C 270,150 310,160 310,200 L 310,310 C 310,355 270,370 200,370 C 130,370 90,355 90,310 Z" fill="url(#caseDark)"/>
    <!-- Lid Seam -->
    <path d="M 95,210 C 140,195 260,195 305,210" fill="none" stroke="#3d3e48" stroke-width="2"/>
    <!-- LED Dot -->
    <circle cx="200" cy="275" r="3.5" fill="#FFC107"/>
  </g>
</svg>
