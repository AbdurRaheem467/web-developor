<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBgMax" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#e9ecef"/>
    </linearGradient>
    <linearGradient id="hpMatte" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b2c34"/>
      <stop offset="50%" stop-color="#18191e"/>
      <stop offset="100%" stop-color="#0d0e12"/>
    </linearGradient>
  </defs>
  <rect width="500" height="500" rx="16" fill="url(#cardBgMax)"/>

  <g transform="translate(50, 40)">
    <!-- Floor Shadow -->
    <ellipse cx="200" cy="380" rx="130" ry="25" fill="#000" opacity="0.18" filter="blur(8px)"/>

    <!-- Headband Arch -->
    <path d="M 90,260 C 90,110 310,110 310,260" fill="none" stroke="url(#hpMatte)" stroke-width="26" stroke-linecap="round"/>
    <path d="M 120,240 C 120,135 280,135 280,240" fill="none" stroke="#121317" stroke-width="12" stroke-linecap="round"/>

    <!-- Left Ear Cup -->
    <g transform="translate(70, 220)">
      <rect x="0" y="0" width="55" height="120" rx="27.5" fill="url(#hpMatte)" stroke="#3a3b46" stroke-width="2"/>
      <ellipse cx="27.5" cy="60" rx="18" ry="45" fill="#090a0d"/>
    </g>

    <!-- Right Ear Cup -->
    <g transform="translate(275, 220)">
      <rect x="0" y="0" width="55" height="120" rx="27.5" fill="url(#hpMatte)" stroke="#3a3b46" stroke-width="2"/>
      <ellipse cx="27.5" cy="60" rx="18" ry="45" fill="#090a0d"/>
    </g>

    <!-- Metallic Pivot Arms -->
    <path d="M 95,200 L 95,230" stroke="#FFC107" stroke-width="4"/>
    <path d="M 305,200 L 305,230" stroke="#FFC107" stroke-width="4"/>
  </g>
</svg>
