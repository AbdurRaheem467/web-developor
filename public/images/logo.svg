<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#07090e" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>

    <!-- Primary Accent Gradient (Indigo to Cyan) -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Secondary Accent Gradient (Cyan to Emerald) -->
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Border Stroke Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.7" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Ambient Glow Background Orb -->
  <circle cx="256" cy="256" r="140" fill="#6366f1" opacity="0.15" filter="url(#glow)" />
  <circle cx="280" cy="220" r="100" fill="#06b6d4" opacity="0.12" filter="url(#glow)" />

  <!-- Monogram Logo Geometry (Stylized A + R with Code Brackets) -->
  <g filter="url(#subtleGlow)">
    <!-- Left Bracket / 'A' Left Leg: < -->
    <path d="M 210 130 
             L 135 256 
             L 210 382" 
          fill="none" 
          stroke="url(#cyanGrad)" 
          stroke-width="38" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Right Bracket / 'R' Outer Shell: > -->
    <path d="M 302 130 
             L 377 256 
             L 302 382" 
          fill="none" 
          stroke="url(#primaryGrad)" 
          stroke-width="38" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Central Slashed Crossbar connecting A & R: / -->
    <line x1="195" y1="365" x2="317" y2="147" 
          stroke="url(#primaryGrad)" 
          stroke-width="36" 
          stroke-linecap="round" />

    <!-- 'A' Inner Bridge -->
    <line x1="165" y1="270" x2="256" y2="270" 
          stroke="url(#cyanGrad)" 
          stroke-width="26" 
          stroke-linecap="round" />

    <!-- 'R' Inner Loop and Dynamic Kick Leg -->
    <path d="M 250 160 
             H 315 
             C 355 160 355 240 315 240 
             H 250 
             M 295 240 
             L 345 355" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="28" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Core Focal Node Point -->
    <circle cx="256" cy="256" r="14" fill="#38bdf8" />
    <circle cx="256" cy="256" r="6" fill="#ffffff" />
  </g>
</svg>
