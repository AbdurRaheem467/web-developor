<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="heroGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FFC107" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#121216" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#070709" stop-opacity="1"/>
    </radialGradient>
    
    <!-- Metallic Case Gradient -->
    <linearGradient id="caseBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c2d35"/>
      <stop offset="30%" stop-color="#1a1b20"/>
      <stop offset="70%" stop-color="#111215"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>

    <linearGradient id="caseInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16171b"/>
      <stop offset="100%" stop-color="#0c0d10"/>
    </linearGradient>

    <!-- Earbud Metallic Highlight -->
    <linearGradient id="earbudStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a3b45"/>
      <stop offset="40%" stop-color="#1d1e24"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#FFC107" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Ambient background glow -->
  <rect width="800" height="800" fill="url(#heroGlow)"/>

  <g transform="translate(0, -20)" filter="url(#shadow)">
    <!-- Base Shadow beneath Case -->
    <ellipse cx="400" cy="590" rx="220" ry="45" fill="#000000" opacity="0.75" filter="blur(15px)"/>

    <!-- Earbuds Standing Behind Case -->
    <!-- Left Earbud -->
    <g transform="translate(290, 160)">
      <!-- Stem -->
      <rect x="35" y="110" width="22" height="150" rx="11" fill="url(#earbudStem)"/>
      <rect x="37" y="112" width="4" height="140" rx="2" fill="#505260" opacity="0.6"/>
      <!-- Main Head -->
      <path d="M 15,110 C -10,80 -5,20 45,15 C 90,10 105,60 85,110 Z" fill="url(#earbudStem)"/>
      <!-- Silicone Tip -->
      <ellipse cx="20" cy="70" rx="22" ry="28" fill="#121316"/>
      <!-- Metallic Charging Contacts -->
      <circle cx="46" cy="250" r="3" fill="#FFC107"/>
      <!-- Acoustic Mesh Vent -->
      <ellipse cx="65" cy="50" rx="6" ry="12" fill="#050507"/>
    </g>

    <!-- Right Earbud -->
    <g transform="translate(430, 160)">
      <!-- Stem -->
      <rect x="35" y="110" width="22" height="150" rx="11" fill="url(#earbudStem)"/>
      <rect x="51" y="112" width="4" height="140" rx="2" fill="#505260" opacity="0.6"/>
      <!-- Main Head -->
      <path d="M 77,110 C 102,80 97,20 47,15 C 2,10 -13,60 7,110 Z" fill="url(#earbudStem)"/>
      <!-- Silicone Tip -->
      <ellipse cx="72" cy="70" rx="22" ry="28" fill="#121316"/>
      <!-- Metallic Charging Contacts -->
      <circle cx="46" cy="250" r="3" fill="#FFC107"/>
      <!-- Acoustic Mesh Vent -->
      <ellipse cx="27" cy="50" rx="6" ry="12" fill="#050507"/>
    </g>

    <!-- Charging Case Base (Open Body) -->
    <path d="M 210,360 
             C 210,310 260,290 400,290 
             C 540,290 590,310 590,360 
             L 590,490 
             C 590,565 520,590 400,590 
             C 280,590 210,565 210,490 Z" 
          fill="url(#caseBody)"/>

    <!-- Rim / Inside Chamber Cavity -->
    <ellipse cx="400" cy="355" rx="180" ry="50" fill="url(#caseInner)" stroke="#383944" stroke-width="2"/>
    <!-- Left Cavity Slot -->
    <ellipse cx="320" cy="355" rx="35" ry="20" fill="#060608" stroke="#1f2026" stroke-width="1.5"/>
    <!-- Right Cavity Slot -->
    <ellipse cx="480" cy="355" rx="35" ry="20" fill="#060608" stroke="#1f2026" stroke-width="1.5"/>

    <!-- Case Matte Finish Highlight Line -->
    <path d="M 230,370 C 310,345 490,345 570,370" fill="none" stroke="#484958" stroke-width="2" opacity="0.7"/>

    <!-- Front LED Status Indicator (Glowing Yellow dot) -->
    <circle cx="400" cy="460" r="4.5" fill="#FFC107"/>
    <circle cx="400" cy="460" r="9" fill="#FFC107" opacity="0.35"/>

    <!-- Subtle Brand Name on Case -->
    <text x="400" y="440" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#66687a" text-anchor="middle" letter-spacing="3">SOUNDWAVE</text>
  </g>
</svg>
