<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBgSport" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#e9ecef"/>
    </linearGradient>
    <linearGradient id="sportMatte" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c2d36"/>
      <stop offset="100%" stop-color="#0f1014"/>
    </linearGradient>
  </defs>
  <rect width="500" height="500" rx="16" fill="url(#cardBgSport)"/>

  <g transform="translate(50, 40)">
    <!-- Floor Shadow -->
    <ellipse cx="200" cy="370" rx="120" ry="22" fill="#000" opacity="0.15" filter="blur(7px)"/>

    <!-- Left Ear Hook -->
    <g transform="translate(70, 110)">
      <!-- Ear Hook Arc -->
      <path d="M 50,150 C 10,120 10,30 65,30 C 100,30 110,70 90,110 L 75,140" fill="none" stroke="url(#sportMatte)" stroke-width="18" stroke-linecap="round"/>
      <!-- Main Housing Body -->
      <circle cx="75" cy="145" r="28" fill="#181920" stroke="#3d3e4c" stroke-width="2"/>
      <circle cx="75" cy="145" r="14" fill="#08090c"/>
      <circle cx="75" cy="145" r="5" fill="#FFC107"/>
    </g>

    <!-- Right Ear Hook -->
    <g transform="translate(230, 110)">
      <!-- Ear Hook Arc -->
      <path d="M 70,150 C 110,120 110,30 55,30 C 20,30 10,70 30,110 L 45,140" fill="none" stroke="url(#sportMatte)" stroke-width="18" stroke-linecap="round"/>
      <!-- Main Housing Body -->
      <circle cx="45" cy="145" r="28" fill="#181920" stroke="#3d3e4c" stroke-width="2"/>
      <circle cx="45" cy="145" r="14" fill="#08090c"/>
      <circle cx="45" cy="145" r="5" fill="#FFC107"/>
    </g>
  </g>
</svg>
