<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="100%">
  <defs>
    <linearGradient id="hBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>

    <linearGradient id="hPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <linearGradient id="hCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    
    <linearGradient id="hTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <filter id="hGlow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Mark Container -->
  <g transform="translate(15, 15) scale(0.37)">
    <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#hBgGrad)" stroke="url(#hPrimary)" stroke-width="8" />
    <path d="M 210 130 L 135 256 L 210 382" fill="none" stroke="url(#hCyan)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 302 130 L 377 256 L 302 382" fill="none" stroke="url(#hPrimary)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="195" y1="365" x2="317" y2="147" stroke="url(#hPrimary)" stroke-width="36" stroke-linecap="round" />
    <line x1="165" y1="270" x2="256" y2="270" stroke="url(#hCyan)" stroke-width="26" stroke-linecap="round" />
    <path d="M 250 160 H 315 C 355 160 355 240 315 240 H 250 M 295 240 L 345 355" fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="256" cy="256" r="14" fill="#38bdf8" />
    <circle cx="256" cy="256" r="6" fill="#ffffff" />
  </g>

  <!-- Brand Typography -->
  <text x="235" y="115" font-family="'Space Grotesk', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="58" font-weight="800" fill="url(#hTextGrad)" letter-spacing="-1">ABDUR RAHEEM</text>
  <text x="238" y="162" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="600" fill="#06b6d4" letter-spacing="4">WEB DEVELOPER &amp; DESIGNER</text>
  
  <!-- Subtle Tag Indicator -->
  <rect x="740" y="80" width="86" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
  <text x="783" y="101" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#a5b4fc" text-anchor="middle">OFFICIAL</text>
</svg>
